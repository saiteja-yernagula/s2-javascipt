class Animal{
    weight
    height
    constructor(weight,height){
        this.weight=weight
        this.height=height
    }

    details(){
        console.log(this.weight , ' and ', this.height)
    }
}

class Dog extends Animal{
    breed
    purpose
    constructor(weight,height,breed,purpose){
        //it is used to initialize the parent properties
        super(weight,height)
        this.breed=breed
        this.purpose=purpose
    }

    details(){
        console.log(this.breed ,'having a weight of ', this.weight , ' and ', 'height of ', this.height)
    }
}
let obj=new Animal('100kgs','9feet')
console.log(obj)
obj.details()//it calls the parent method

let childobj=new Dog('25kgs', '3feet', 'pumerian', 'playfull')
console.log(childobj)

childobj.details()//it calls the child method and overrides
             //the parent method
