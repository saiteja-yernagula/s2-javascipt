function add(val){
    return new Promise((res)=>{
        res(val+10)
    })
}
function sub(val){
    return new Promise((res)=>{
        res(val-5)
    })
}

function mul(val){
    return new Promise((res)=>{
        res(val*2)
    })
}
function div(val){
    return new Promise((res)=>{
        res(val/6)
    })
}
